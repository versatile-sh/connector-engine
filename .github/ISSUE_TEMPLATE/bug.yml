name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mise run up
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - person (console)
        - headless
        - not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `mise run logs`. Remove tokens and keys first.
      render: text
  - type: markdown
    attributes:
      value: Found a security issue? Do not open an issue. Follow [SECURITY.md](https://github.com/versatile-sh/connector-engine/blob/main/SECURITY.md).
