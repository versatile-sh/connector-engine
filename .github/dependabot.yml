version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /**/console/web
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/cloud
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/assets/src
    ignore:
      - dependency-name: "opentype.js"
        versions: [">=2.0.0"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /docs/assets/readme/src
    ignore:
      - dependency-name: "opentype.js"
        versions: [">=2.0.0"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
