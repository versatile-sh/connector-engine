name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run the full approval and evaluation sweeps (about 10 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -short ./...
      - name: Layering check
        run: |
          if [ -f scripts/check-layering.sh ]; then
            bash scripts/check-layering.sh
          else
            echo "scripts/check-layering.sh not present, skipped"
          fi
      - name: Adapters check
        run: |
          go run ./cmd/connector-engine --config deploy/profiles/headless/connector-engine.yaml --adapters deploy/profiles/headless/adapters.yaml adapters check
          if [ -d selfhosted/deploy/profiles/person ]; then
            go run ./selfhosted/cmd/connector-engine --config selfhosted/deploy/profiles/person/connector-engine.yaml --adapters selfhosted/deploy/profiles/person/adapters.yaml adapters check
          else
            go run ./cmd/connector-engine --config deploy/profiles/person/connector-engine.yaml --adapters deploy/profiles/person/adapters.yaml adapters check
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0

  web:
    name: Console web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locate the web app
        id: dir
        run: |
          for d in selfhosted/console/web console/web; do
            if [ -f "$d/package.json" ]; then echo "path=$d" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "no console web app found" >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ${{ steps.dir.outputs.path }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ steps.dir.outputs.path }}
      - run: npm run lint
        working-directory: ${{ steps.dir.outputs.path }}
      - run: npm run typecheck
        working-directory: ${{ steps.dir.outputs.path }}
      - run: npm test
        working-directory: ${{ steps.dir.outputs.path }}
      - run: npm run build
        working-directory: ${{ steps.dir.outputs.path }}

  sweeps:
    name: Exhaustive sweeps
    if: github.event_name == 'workflow_dispatch' && inputs.exhaustive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout 40m ./core/approval ./core/evaluate
        env:
          CN_EXHAUSTIVE: "1"
