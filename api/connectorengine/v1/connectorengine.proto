  bool show = 2;
  bool install = 3;
  string ceiling = 4;
  bool named = 5;
  repeated string rules = 6;
}

message LevelRequest {
  string id = 1;
  string level = 2;
}

message LintListingRequest {
  Manifest manifest = 1;
  bool capture = 2;
}

message LintResult {
  repeated Finding findings = 1;
  repeated RawDefinition definitions = 2;
}

message ListAgentFunctionsRequest {
  string workspace = 1;
  string agent = 2;
  string agent_owner = 3;
  string on_behalf_of = 4;
  string session = 5;
  string caller = 6;
}

message ListApprovalsRequest {
  string state = 1;
  string session = 2;
  string agent = 3;
  string connector = 4;
  google.protobuf.Timestamp since = 5;
  int64 limit = 6;
}

message ListBindingsRequest {
  string id = 1;
  string agent = 2;
  string owner = 3;
}

message ListCallsRequest {
  string agent = 1;
  string session = 2;
  string connector = 3;
  string state = 4;
  google.protobuf.Timestamp since = 5;
  int64 limit = 6;
}

message ListCredentialsRequest {
  string owner_kind = 1;
  string owner_id = 2;
  string connector = 3;
}

message ListGrantsRequest {
  string scope_kind = 1;
  string scope_id = 2;
  string agent = 3;
  string connector = 4;
}

message ListListingsRequest {
  string workspace = 1;
  string source = 2;
  string trust_level = 3;
  string kind = 4;
  string q = 5;
}

message ListMembersRequest {
  string person = 1;
  string group = 2;
}

message ListRolesRequest {
  string tenant = 1;
  string person = 2;
}

message Listing {
  ListingRef ref = 1;
  string source = 2;
  string publisher = 3;
  string status = 4;
  bool starter = 5;
  repeated string versions = 6;
}

message ListingRef {
  string owner = 1;
  string name = 2;
}

message ListingStatusRequest {
  string owner = 1;
  string name = 2;
  string version = 3;
  string reason = 4;
}

message ListingVersion {
