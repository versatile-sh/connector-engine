  string key_ref = 2;
}

message SessionRequest {
  string id = 1;
}

message Signature {
  string type = 1;
  string identity = 2;
  string issuer = 3;
}

message Skill {
  string name = 1;
  string category = 2;
  SkillSource source = 3;
  SkillLicence licence = 4;
  string redistribution = 5;
  bool has_scripts = 6;
  repeated string requires = 7;
  repeated SkillFile files = 8;
}

message SkillFile {
  string path = 1;
  int64 bytes = 2;
  string sha256 = 3;
  string url = 4;
  bytes content = 5;
}

message SkillLicence {
  string spdx = 1;
  string from = 2;
  bool redistributable = 3;
}

message SkillSource {
  string repository = 1;
  string path = 2;
  string commit = 3;
  string url = 4;
}

message SourceInfo {
  string registry = 1;
  string upstream_name = 2;
  string upstream_version = 3;
  string status = 4;
  google.protobuf.Timestamp imported_at = 5;
}

message SourceRequest {
  string source = 1;
}

message SourceStatus {
  string name = 1;
  SourceSync last_sync = 2;
}

message SourceSync {
  string source = 1;
  google.protobuf.Timestamp last_sync = 2;
  int64 imported = 3;
  int64 skipped = 4;
  string error = 5;
}

message Sources {
  repeated SourceStatus items = 1;
}

message StarterRequest {
  string owner = 1;
  string name = 2;
  bool starter = 3;
}

message StatusChange {
  Listing listing = 1;
  Operation operation = 2;
  repeated string blocked = 3;
}

message Tenant {
  string id = 1;
  string state = 2;
  string key_ref = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp removed_at = 6;
  map<string, int64> counts = 7;
}

message TenantRequest {
  string tenant = 1;
}

message UI {
  bool mcp_apps = 1;
}

message UpdateConnectorRequest {
  string id = 1;
  string version = 2;
}

message UpdateResult {
  Connector connector = 1;
  repeated Change changes = 2;
  repeated string quarantined = 3;
  repeated string tenant_rows_unmatched = 4;
}

message VersionRef {
  ListingRef listing = 1;
  string version = 2;
}

message WatchApprovalsRequest {
  int64 after = 1;
  int64 limit = 2;
}

message WorkspaceRequest {
  string workspace = 1;
}
