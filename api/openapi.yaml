info:
  title: connector-engine
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/access:explain:
    post:
      operationId: explainAccess
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
