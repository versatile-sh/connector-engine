                caller:
                  type: string
                connector:
                  type: string
                function:
                  type: string
                on_behalf_of:
                  type: string
                session:
                  type: string
                workspace:
                  type: string
              required:
                - workspace
                - agent
                - connector
                - function
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
          description: Success
        default:
          $ref: '#/components/responses/Problem'
      tags:
        - connector
  /v1/adapters:
    get:
      operationId: listAdapters
      parameters: []
      responses:
        "200":
          content:
