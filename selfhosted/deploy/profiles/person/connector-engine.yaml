mode: production
server:
  listen: 0.0.0.0:8080
  grpcListen: ""
  operatorListen: 0.0.0.0:8081
  publicURL: ""
  maxBodyBytes: 8388608
auth:
  audience: urn:connector-engine:local:mcp
  manageAudience: urn:connector-engine:local
  localIssuer: {enabled: true}
  agentTokenMaxLifetime: 720h
  operator: {tokenRef: "file:/run/connector-engine/operator-token"}
gateway:
  skills: tools+prompts
  relayInstructions: pinned
  upstreamContent: granted
bootstrap:
  roles:
    - {tenant: local, person: owner, role: tenant_admin, scope: t/local}
secrets:
  dir: /var/lib/connector-engine/secrets
  unlockSocket: /run/connector-engine-unlock/unlock.sock
runtime:
  allowPrivateHosts: true
retention:
  deliveredEvents: 168h
  idempotencyKeys: 168h
  audit: 2160h
  calls: 2160h
